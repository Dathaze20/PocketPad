name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Tests run first: a failure here fails the job and nothing downstream,
      # including the release publication below, is reached.
      - name: Run unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      # Reporting only — the authoritative pass/fail signal is the step above,
      # so a hiccup here must not fail an otherwise good build.
      - name: Test summary
        if: always()
        continue-on-error: true
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, os, xml.etree.ElementTree as ET
          files = sorted(glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml'))
          print('## Unit tests\n')
          if not files:
              print('No test results were produced.')
              raise SystemExit(0)
          print('| Suite | Executed | Passed | Failed | Errors | Skipped |')
          print('|---|--:|--:|--:|--:|--:|')
          T = F = E = S = 0
          for path in files:
              r = ET.parse(path).getroot()
              t = int(r.get('tests', 0)); f = int(r.get('failures', 0))
              e = int(r.get('errors', 0)); s = int(r.get('skipped', 0))
              T += t; F += f; E += e; S += s
              name = os.path.basename(path)[5:-4].rsplit('.', 1)[-1]
              print(f'| {name} | {t} | {t - f - e - s} | {f} | {e} | {s} |')
          print(f'| **Total** | **{T}** | **{T - F - E - S}** | **{F}** | **{E}** | **{S}** |')
          PY
          cat "$GITHUB_STEP_SUMMARY"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PocketPad-unit-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest

      - name: Build debug APK and release bundle
        run: ./gradlew --no-daemon assembleDebug bundleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketPad-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release bundle (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: PocketPad-release-aab-unsigned
          path: app/build/outputs/bundle/release/app-release.aab

      # Public, no-login download for phones:
      # https://github.com/Dathaze20/PocketPad/releases/latest
      # Only a push to main publishes. A pull_request run never does, even
      # from a branch named main in a fork: its ref is refs/pull/N/merge and
      # its event is not "push".
      - name: Publish APK to the "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PocketPad.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest PocketPad.apk \
            --title "PocketPad — newest build" \
            --notes "Auto-built from the newest commit. On your phone: tap PocketPad.apk below, then open the download to install."
