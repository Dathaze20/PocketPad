plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.dathaze.pocketpad'
    compileSdk 36

    defaultConfig {
        applicationId "com.dathaze.pocketpad"
        minSdk 28            // BluetoothHidDevice API requires Android 9 (Pie)
        targetSdk 36
        // Android decides what counts as an upgrade by versionCode alone, and it is set here
        // by hand — it is NOT derived from versionName (2.3.0 was 17, not 20300). The in-app
        // updater compares this number against the one CI reads back out of the published
        // APK, so bumping it is what makes a build visible to phones that already have
        // PocketPad. See README → Updating.
        versionCode 19
        versionName "2.5.0"
    }

    // Release signing: set these four properties in ~/.gradle/gradle.properties
    // (never in the repo) and bundleRelease produces a Play-ready signed AAB.
    // Without them, release builds stay unsigned. See docs/PLAY_STORE_CHECKLIST.md
    def hasReleaseKeystore = project.hasProperty('POCKETPAD_STORE_FILE')
    signingConfigs {
        // Stable, committed debug key so every CI build can update the
        // previous install (a fresh random debug key would make Android
        // reject the update). This key is for sideloaded test builds only —
        // Play releases use the POCKETPAD_* release keystore below.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseKeystore) {
            release {
                storeFile file(POCKETPAD_STORE_FILE)
                storePassword POCKETPAD_STORE_PASSWORD
                keyAlias POCKETPAD_KEY_ALIAS
                keyPassword POCKETPAD_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    // Make the unit-test run self-reporting in CI logs: per-test results plus
    // a final count of executed / passed / failed / skipped.
    testOptions {
        unitTests.all {
            testLogging {
                events "passed", "skipped", "failed"
                exceptionFormat "full"
            }
            afterSuite { desc, result ->
                if (desc.parent == null) {
                    println "\nUnit tests: ${result.testCount} executed, " +
                            "${result.successfulTestCount} passed, " +
                            "${result.failedTestCount} failed, " +
                            "${result.skippedTestCount} skipped — ${result.resultType}"
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    // Photo Picker contract for custom controller backgrounds
    implementation 'androidx.activity:activity-ktx:1.11.0'

    // Local JVM regression tests. These cover the HID report model, the
    // external-controller tracker, the per-style control mapping and the
    // updater's version, URL and download rules — none of which touch the
    // Android framework. Run with: ./gradlew test
    testImplementation 'junit:junit:4.13.2'
    // The real org.json, not the android.jar stub. Every method on the stub throws, so the
    // release-metadata parsing could otherwise only be tested on a device — which is exactly
    // the code that has to behave when GitHub sends back something malformed.
    testImplementation 'org.json:json:20231013'
}
