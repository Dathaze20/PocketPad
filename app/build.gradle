plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.dathaze.pocketpad'
    compileSdk 36

    defaultConfig {
        applicationId "com.dathaze.pocketpad"
        minSdk 28            // BluetoothHidDevice API requires Android 9 (Pie)
        targetSdk 36
        versionCode 5
        versionName "1.4.0"
    }

    // Release signing: set these four properties in ~/.gradle/gradle.properties
    // (never in the repo) and bundleRelease produces a Play-ready signed AAB.
    // Without them, release builds stay unsigned. See docs/PLAY_STORE_CHECKLIST.md
    def hasReleaseKeystore = project.hasProperty('POCKETPAD_STORE_FILE')
    signingConfigs {
        // Stable, committed debug key so every CI build can update the
        // previous install (a fresh random debug key would make Android
        // reject the update). This key is for sideloaded test builds only —
        // Play releases use the POCKETPAD_* release keystore below.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseKeystore) {
            release {
                storeFile file(POCKETPAD_STORE_FILE)
                storePassword POCKETPAD_STORE_PASSWORD
                keyAlias POCKETPAD_KEY_ALIAS
                keyPassword POCKETPAD_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
}
